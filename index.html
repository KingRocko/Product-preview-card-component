<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

    <title>Frontend Mentor | Product preview card component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
        .attribution {
            font-size: 0.6875rem;
            text-align: center;
        }

        .attribution a {
            color: hsl(228, 45%, 44%);
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <div class="image-wrapper">
                <img src="images/image-product-desktop.jpg" alt="Gabtrielle Chanel Paris Flacon on a table" class="product-image">
            </div>
            <div class="content-wrapper">
                <p class="product-category">Perfume</p>
                <h1 class="product-title">Gabrielle Essence Eau De Parfum</h1>
                <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
                    Perfumer-Creator for the House of CHANEL.</p>
                <h2 class="product-price">$149.99</h2>
                <p class="product-old-price">$169.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
    </main>
</body>
</html>
