<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="card">
            <picture class="image-wrapper">
                <source media="(max-width: 48em"
                        srcset="images/image-product-mobile.jpg">
                <source media="(min-width: 48em"
                        srcset="images/image-product-desktop.jpg">
                <img class="product-image" src="images/image-product-mobile.jpg" alt="Gabtrielle Chanel Paris Flacon on a table">
            </picture>
            <div class="content-wrapper">
                <div class="product-wrapper">
                    <p class="product-category">Perfume</p>
                    <h1 class="product-title">Gabrielle Essence Eau De Parfum</h1>
                    <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
                        Perfumer-Creator for the House of CHANEL.</p>
                </div>
                <div class="price-wrapper">
                    <h2 class="product-price">$149.99</h2>
                    <p class="product-old-price">$169.99</p>
                </div>
                <button class="add-to-cart-button">
                    <img src="images/icon-cart.svg" alt="">
                    Add to Cart
                </button>
            </div>
        </div>
    </main>
</body>
</html>
